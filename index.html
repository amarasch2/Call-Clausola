<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flusso call clausola</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: toolbar on top, dot-grid canvas on the left, inspector on the right; stacks on phones */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#14203a; --muted:#5b6780; --line:#d6dce7; --grid:#c3ccdb;
  --accent:#2747d0; --accent-ink:#ffffff; --accent-soft:#dfe5fb;
  --branch:#a35f00; --branch-soft:#fff3df; --end:#14203a; --end-ink:#f3f5fa;
  --danger:#bf3328; --ok:#1d7a4b; --ph:#ffeaa6; --ph-ink:#4d3a00; --shadow:rgb(20 32 58 / .08);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1320; --surface:#161d2c; --surface-2:#1b2334; --ink:#e5e9f2; --muted:#98a3b9; --line:#2b3548; --grid:#2c3649;
  --accent:#8199ff; --accent-ink:#0b1020; --accent-soft:#232d55;
  --branch:#efaa45; --branch-soft:#33270f; --end:#e5e9f2; --end-ink:#121827;
  --danger:#ff7d70; --ok:#5cc28e; --ph:#4b3c0c; --ph-ink:#ffe28a; --shadow:rgb(0 0 0 / .35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1320; --surface:#161d2c; --surface-2:#1b2334; --ink:#e5e9f2; --muted:#98a3b9; --line:#2b3548; --grid:#2c3649;
  --accent:#8199ff; --accent-ink:#0b1020; --accent-soft:#232d55;
  --branch:#efaa45; --branch-soft:#33270f; --end:#e5e9f2; --end-ink:#121827;
  --danger:#ff7d70; --ok:#5cc28e; --ph:#4b3c0c; --ph-ink:#ffe28a; --shadow:rgb(0 0 0 / .35); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#shell{height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* toolbar */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-size:22px;font-weight:700;margin:0;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.group{display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.btn{border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn:disabled{opacity:.45;cursor:default}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.btn-outline{border:1px solid var(--line);background:var(--surface)}
.btn-danger{color:var(--danger)}
.btn-small{padding:4px 8px;font-size:13px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;min-width:52px;justify-content:center}
.sw{width:11px;height:11px;display:inline-block;flex:none}
.sw-step{background:var(--surface);border:2px solid var(--accent);border-radius:3px}
.sw-branch{background:var(--branch-soft);border:2px solid var(--branch);transform:rotate(45deg) scale(.85)}
.sw-end{background:var(--end);border-radius:50%}
.savebox{display:flex;align-items:center;gap:10px}
.status{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.status.ok{color:var(--ok)} .status.warn{color:var(--branch)}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--branch-soft);border:1px solid var(--branch);border-radius:10px;padding:8px 12px}
.banner span{margin-right:auto}

/* canvas */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:10px}
.canvas{position:relative;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;min-height:0;cursor:grab}
.canvas.panning{cursor:grabbing}
#sizer{position:relative}
#world{position:absolute;left:0;top:0;transform-origin:0 0;background-image:radial-gradient(var(--grid) 1.1px,transparent 1.3px);background-size:20px 20px}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--muted);stroke-width:1.6}
.edge.is-sel{stroke:var(--accent);stroke-width:2.4}
.edge.temp{stroke:var(--accent);stroke-dasharray:6 5}
.edge-hit{fill:none;stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
.arrowhead{fill:var(--muted)} .arrowhead.sel{fill:var(--accent)}
#nodes,#labels{position:absolute;inset:0}
#nodes,#labels{pointer-events:none}
.node{pointer-events:auto;position:absolute;width:230px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px 16px;box-shadow:0 1px 3px var(--shadow);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.node:hover{border-color:var(--muted)}
.node.is-sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node.drop-target{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node-head{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.node-num{color:var(--accent);font-weight:600}
.node-start{margin-left:auto;background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:4px;letter-spacing:.06em}
.node-title{font-family:var(--f-display);font-weight:700;font-size:16px;margin:4px 0 3px;line-height:1.2;overflow-wrap:anywhere}
.node-text{font-size:12.5px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.t-bivio{background:var(--branch-soft);border:1.5px dashed var(--branch)}
.t-bivio .node-kind{color:var(--branch)}
.t-bivio .node-kind::before{content:"◆ "}
.t-chiusura{background:var(--end);border-color:var(--end);color:var(--end-ink)}
.t-chiusura .node-head,.t-chiusura .node-text{color:var(--end-ink);opacity:.75}
.t-chiusura .node-num{color:var(--end-ink)}
.port{position:absolute;left:50%;bottom:-9px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent);cursor:crosshair;touch-action:none}
.port:hover,.node.is-sel .port{background:var(--accent)}
.edge-label{position:absolute;transform:translate(-50%,-50%);font:500 12px var(--f-body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap;cursor:pointer;pointer-events:auto;box-shadow:0 1px 2px var(--shadow)}
.edge-label.is-sel{border-color:var(--accent);color:var(--accent)}
mark.ph{background:var(--ph);color:var(--ph-ink);border-radius:3px;padding:0 2px}

/* inspector */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.panel h2{font-family:var(--f-display);font-size:20px;margin:2px 0 0;line-height:1.2;text-wrap:balance}
.panel h3{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:500}
.panel section{display:flex;flex-direction:column}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.5}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:6px}
.outs{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:8px}
.outs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 6px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px}
.outs li .link{grid-column:1/-1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:34px;height:34px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--danger);border-color:var(--danger)}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-size:13px;overflow-wrap:anywhere}
.link:hover{text-decoration:underline}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.actions{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.stats b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
.issues{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.issues li{color:var(--muted)}
.ok-line{margin:0;color:var(--ok);font-weight:500}
.howto{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.backup summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:13px}
.backup[open]{display:flex;flex-direction:column;gap:8px}
.backup textarea{font-family:var(--f-mono);font-size:12px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
.ov-inner{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-height:100%}
.cm-top{display:flex;align-items:flex-start;gap:12px}
.trail{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px;color:var(--muted);min-width:0;padding-top:8px}
.trail li+li::before{content:"›";margin-right:6px}
.trail li:last-child{color:var(--ink);font-weight:600}
.cm-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.cm-card.t-bivio{border:1.5px dashed var(--branch);background:var(--branch-soft)}
.cm-meta{display:flex;gap:10px;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cm-title{font-family:var(--f-display);font-size:clamp(22px,3.2vw,30px);margin:0;line-height:1.15;text-wrap:balance}
.cm-text{font-size:clamp(19px,2.4vw,24px);line-height:1.55;overflow-wrap:anywhere}
.cm-text:empty::before{content:"(nessun testo in questo blocco)";color:var(--muted);font-size:16px}
.cm-note{border-top:1px solid var(--line);padding-top:12px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.cm-note b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;cursor:pointer;position:relative}
.choice:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.choice .key{font-family:var(--f-mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 5px}
.choice .choice-label{font-family:var(--f-display);font-weight:700;font-size:18px;overflow-wrap:anywhere}
.choice .choice-to{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.endbox{background:var(--end);color:var(--end-ink);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.endbox strong{margin-right:auto;font-family:var(--f-display);font-size:18px}
.cm-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:auto}
.kbd-hint{font-size:12px;color:var(--muted)}
.sc-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.sc-top h2{font-family:var(--f-display);font-size:26px;margin:2px 0 0}
.sc-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.sc-sec h3{margin:0;font-family:var(--f-display);font-size:18px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sc-sec h3 .node-num{font-family:var(--f-mono);font-size:13px}
.sc-sec h3 .eyebrow{font-size:10px}
.sc-sec p{margin:0;font-size:15.5px;line-height:1.6;max-width:65ch;overflow-wrap:anywhere}
.sc-sec .sc-note{font-size:13px;color:var(--muted)}
.sc-outs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted)}
.sc-outs b{color:var(--ink);font-weight:600}
#sc-body{display:flex;flex-direction:column;gap:10px}
#sc-raw{font-family:var(--f-mono);font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:0 4px 16px var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:820px){
  html,body{height:auto}
  #shell{height:auto}
  .main{display:flex;flex-direction:column}
  .canvas{height:62vh;min-height:360px}
  .panel{overflow:visible}
  .brand{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.canvas.loading #world{opacity:.45}
.hist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;align-items:center;gap:8px;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
.hist li span{min-width:0;overflow-wrap:anywhere}
.hist .v{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-right:6px}
</style>
</head>
<body>
<div id="shell">
<header class="topbar">
  <div class="brand"><span class="eyebrow">Flusso del discorso</span><h1 id="flow-name">Flusso call</h1></div>
  <div class="group" role="group" aria-label="Aggiungi blocco">
    <button class="btn" id="add-passaggio" title="Aggiungi un passaggio del discorso"><span class="sw sw-step"></span>Passaggio</button>
    <button class="btn" id="add-bivio" title="Aggiungi un bivio: un punto in cui il discorso cambia in base alla risposta"><span class="sw sw-branch"></span>Bivio</button>
    <button class="btn" id="add-chiusura" title="Aggiungi una chiusura"><span class="sw sw-end"></span>Chiusura</button>
  </div>
  <div class="group" role="group" aria-label="Cronologia">
    <button class="btn" id="btn-undo" title="Annulla (Ctrl+Z)" aria-label="Annulla">↶</button>
    <button class="btn" id="btn-redo" title="Ripeti (Ctrl+Y)" aria-label="Ripeti">↷</button>
  </div>
  <div class="group" role="group" aria-label="Zoom">
    <button class="btn" id="zoom-out" aria-label="Riduci">−</button>
    <button class="btn mono" id="zoom-val" title="Adatta allo schermo">100%</button>
    <button class="btn" id="zoom-in" aria-label="Ingrandisci">+</button>
  </div>
  <div class="group" role="group" aria-label="Usa il discorso">
    <button class="btn" id="btn-script">Script</button>
    <button class="btn" id="btn-call">▶ Prova la call</button>
  </div>
  <div class="savebox"><span id="save-status" class="status">Connessione…</span><button class="btn btn-primary" id="btn-save" disabled>Salva</button></div>
</header>
<div id="conflict-banner" class="banner" hidden><span id="conflict-msg"></span><button class="btn btn-outline" id="conflict-load">Carica la sua versione</button><button class="btn" id="conflict-overwrite">Sovrascrivi con la mia</button></div>
<div id="draft-banner" class="banner" hidden><span id="draft-msg">In questo browser c'è una bozza non salvata.</span><button class="btn btn-outline" id="draft-restore">Ripristina bozza</button><button class="btn" id="draft-discard">Scarta</button></div>
<main class="main">
  <div id="canvas" class="canvas" aria-label="Diagramma del discorso"><div id="sizer"><div id="world"><svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg><div id="nodes"></div><div id="labels"></div></div></div></div>
  <aside id="panel" class="panel" aria-label="Dettagli"></aside>
</main>
<div id="callmode" class="overlay" role="dialog" aria-modal="true" aria-label="Prova la call" hidden>
  <div class="ov-inner">
    <div class="cm-top"><button class="btn btn-outline" id="cm-exit">Esci</button><ol id="cm-trail" class="trail" aria-label="Percorso"></ol></div>
    <div id="cm-card" class="cm-card">
      <div class="cm-meta"><span id="cm-num" class="node-num"></span><span id="cm-kind"></span></div>
      <h2 id="cm-title" class="cm-title"></h2>
      <div id="cm-text" class="cm-text"></div>
      <div id="cm-note" class="cm-note" hidden></div>
    </div>
    <div id="cm-choices" class="choices"></div>
    <div class="cm-foot"><button class="btn btn-outline" id="cm-back">← Indietro</button><span class="kbd-hint">Tasti 1–9 per scegliere · ← per tornare · Esc per uscire</span></div>
  </div>
</div>
<div id="scriptview" class="overlay" role="dialog" aria-modal="true" aria-label="Script completo" hidden>
  <div class="ov-inner">
    <div class="sc-top"><div><span class="eyebrow">Script completo</span><h2 id="sc-name"></h2></div><div class="row"><button class="btn btn-primary" id="sc-copy">Copia testo</button><button class="btn btn-outline" id="sc-close">Chiudi</button></div></div>
    <textarea id="sc-raw" rows="10" readonly hidden aria-label="Testo dello script"></textarea>
    <div id="sc-body"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
